[project]
name = "spine-render"
version = "0.1.0"
description = "Client for the render API of the virtual endoscope (recordings / authored trajectories / deltas → frames rendered by the hosted, closed-source Altician viewer)."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
step = ["websockets>=12"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
