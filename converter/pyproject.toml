[project]
name = "spine-il-converter"
version = "0.1.0"
description = "Convert tracked-instrument surgical demonstration sessions (recorder schema v2 JSONL) into LeRobot v3 datasets."
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.12"
dependencies = [
  "lerobot[dataset]>=0.6.1,<0.7",
  "numpy>=2.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spine-il-convert = "spine_il_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_il_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds a real LeRobot dataset (video encoding) or runs lerobot-train"]
